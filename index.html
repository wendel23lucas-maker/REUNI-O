<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reuniões</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
  :root{
    --bg:#0F1115;
    --surface:#171B21;
    --surface-2:#1E232B;
    --border:#2A303B;
    --text:#E8EAED;
    --muted:#8A93A3;
    --accent:#FF4B3E;
    --accent-soft:rgba(255,75,62,.14);
    --calm:#4FD1C5;
    --calm-soft:rgba(79,209,197,.14);
    --radius:14px;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;-webkit-font-smoothing:antialiased;}
  .app{max-width:480px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;background:var(--bg);position:relative;}
  h1,h2,h3{font-family:'Space Grotesk',sans-serif;margin:0;letter-spacing:-.01em;}
  .mono{font-family:'IBM Plex Mono',monospace;}
  header.top{padding:28px 20px 8px;}
  .eyebrow{color:var(--muted);font-size:13px;text-transform:uppercase;letter-spacing:.08em;}
  .top h1{font-size:28px;margin-top:4px;}
  main{flex:1;padding:0 20px 100px;overflow-y:auto;}

  .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:20px 0;}
  .stat{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px 10px;text-align:center;}
  .stat b{display:block;font-family:'Space Grotesk';font-size:24px;}
  .stat span{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.05em;}

  .quick{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:24px;}
  .quick button{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px;text-align:left;color:var(--text);font-family:inherit;cursor:pointer;transition:.15s;}
  .quick button:hover{border-color:var(--accent);}
  .quick .ic{font-size:20px;display:block;margin-bottom:6px;}
  .quick small{color:var(--muted);display:block;font-size:12px;margin-top:2px;}

  .section-title{display:flex;justify-content:space-between;align-items:center;margin:22px 0 10px;}
  .section-title h2{font-size:16px;}
  .section-title a{color:var(--calm);font-size:13px;cursor:pointer;text-decoration:none;}

  .empty{border:1px dashed var(--border);border-radius:var(--radius);padding:28px 16px;text-align:center;color:var(--muted);font-size:13px;}
  .empty b{display:block;color:var(--text);font-family:'Space Grotesk';font-size:15px;margin-bottom:4px;}

  .meeting-card{background:var(--surface);border:1px solid var(--border);border-left:4px solid var(--mc,var(--calm));border-radius:var(--radius);padding:14px;margin-bottom:10px;cursor:pointer;display:flex;justify-content:space-between;gap:10px;}
  .meeting-card .info b{display:block;font-family:'Space Grotesk';font-size:15px;}
  .meeting-card .info span{color:var(--muted);font-size:12px;}
  .meeting-card .time{text-align:right;font-size:12px;color:var(--muted);white-space:nowrap;}
  .meeting-card .time b{color:var(--text);display:block;font-family:'IBM Plex Mono';font-size:13px;}
  .tag-transcript{display:inline-block;margin-top:6px;font-size:10px;color:var(--accent);border:1px solid var(--accent);border-radius:20px;padding:1px 7px;}

  nav.tabs{position:sticky;bottom:0;background:var(--surface);border-top:1px solid var(--border);display:grid;grid-template-columns:repeat(4,1fr);max-width:480px;margin:0 auto;width:100%;}
  nav.tabs button{background:none;border:none;color:var(--muted);font-family:inherit;font-size:11px;padding:10px 0 12px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px;}
  nav.tabs button .ic{font-size:18px;}
  nav.tabs button.active{color:var(--accent);}

  .fab{position:absolute;right:20px;bottom:88px;width:56px;height:56px;border-radius:50%;background:var(--accent);color:#fff;border:none;font-size:26px;box-shadow:0 8px 20px rgba(255,75,62,.35);cursor:pointer;z-index:5;}

  .cal-head{display:flex;justify-content:space-between;align-items:center;margin:10px 0;}
  .cal-head button{background:var(--surface);border:1px solid var(--border);color:var(--text);border-radius:8px;width:32px;height:32px;cursor:pointer;}
  .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center;}
  .cal-grid .dow{color:var(--muted);font-size:11px;padding:4px 0;}
  .cal-grid .day{aspect-ratio:1;border-radius:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:13px;cursor:pointer;position:relative;border:1px solid transparent;}
  .cal-grid .day.other{color:#3a4150;}
  .cal-grid .day.today{border-color:var(--calm);}
  .cal-grid .day .dot{width:4px;height:4px;border-radius:50%;background:var(--accent);margin-top:3px;}
  .cal-grid .day:hover{background:var(--surface-2);}

  .modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:flex-end;justify-content:center;z-index:50;}
  .modal-bg.center{align-items:center;}
  .modal{background:var(--surface);width:100%;max-width:480px;border-radius:20px 20px 0 0;padding:20px;max-height:88vh;overflow-y:auto;}
  .modal-bg.center .modal{border-radius:20px;max-height:82vh;}
  .modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;}
  .modal-head button{background:none;border:none;color:var(--muted);font-size:20px;cursor:pointer;}

  label{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin:14px 0 6px;}
  input[type=text],input[type=datetime-local],textarea,select{width:100%;background:var(--surface-2);border:1px solid var(--border);color:var(--text);border-radius:10px;padding:11px;font-family:inherit;font-size:14px;}
  textarea{resize:vertical;min-height:70px;}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .colors{display:flex;gap:8px;margin-top:6px;}
  .colors span{width:26px;height:26px;border-radius:50%;cursor:pointer;border:2px solid transparent;}
  .colors span.sel{border-color:#fff;}
  .btn-primary{width:100%;background:var(--accent);color:#fff;border:none;border-radius:12px;padding:13px;font-family:'Space Grotesk';font-weight:600;font-size:15px;margin-top:20px;cursor:pointer;}
  .btn-ghost{width:100%;background:none;border:1px solid var(--border);color:var(--muted);border-radius:12px;padding:12px;margin-top:10px;cursor:pointer;font-family:inherit;}

  .rec-box{background:var(--surface-2);border:1px solid var(--border);border-radius:var(--radius);padding:16px;text-align:center;margin-top:16px;}
  .rec-btn{width:64px;height:64px;border-radius:50%;border:none;background:var(--accent);color:#fff;font-size:24px;cursor:pointer;transition:.2s;}
  .rec-btn.recording{animation:pulse 1.4s infinite;}
  @keyframes pulse{0%{box-shadow:0 0 0 0 var(--accent-soft);}70%{box-shadow:0 0 0 18px rgba(255,75,62,0);}100%{box-shadow:0 0 0 0 rgba(255,75,62,0);}}
  .wave{display:flex;align-items:center;justify-content:center;gap:3px;height:36px;margin:12px 0;}
  .wave i{width:3px;background:var(--accent);border-radius:2px;height:6px;transition:height .08s;}
  .rec-status{font-size:12px;color:var(--muted);font-family:'IBM Plex Mono';margin-top:8px;}
  .transcript-box{background:var(--surface-2);border:1px solid var(--border);border-radius:10px;padding:12px;margin-top:12px;font-size:13px;line-height:1.6;max-height:220px;overflow-y:auto;white-space:pre-wrap;}
  .transcript-box.empty2{color:var(--muted);font-style:italic;}
  .note{font-size:11px;color:var(--muted);margin-top:10px;line-height:1.5;}
  .share-row{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:6px;}
  .share-row button{background:var(--surface-2);border:1px solid var(--border);border-radius:10px;padding:10px 4px;color:var(--text);font-family:inherit;font-size:11px;cursor:pointer;text-align:center;line-height:1.7;}
  .share-row button:hover{border-color:var(--calm);}
</style>
</head>
<body>
<div class="app" id="app">

  <header class="top">
    <div class="eyebrow" id="greeting">Bom dia</div>
    <h1>Reuniões</h1>
  </header>

  <main id="main"></main>

  <button class="fab" onclick="openNewMeeting()">+</button>

  <nav class="tabs">
    <button class="tab-btn active" data-tab="home" onclick="setTab('home')"><span class="ic">🏠</span>Início</button>
    <button class="tab-btn" data-tab="calendar" onclick="setTab('calendar')"><span class="ic">🗓️</span>Calendário</button>
    <button class="tab-btn" data-tab="history" onclick="setTab('history')"><span class="ic">📋</span>Histórico</button>
    <button class="tab-btn" data-tab="reports" onclick="setTab('reports')"><span class="ic">📊</span>Relatórios</button>
  </nav>
</div>

<script>
const STORAGE_KEY = 'meetings';
let meetings = [];
let currentTab = 'home';
let calRef = new Date();
let activeMeetingId = null;

// audio/recognition state
let mediaStream=null, mediaRecorder=null, recognition=null, audioCtx=null, analyser=null, rafId=null;
let recording=false, finalTranscript='', chunks=[];

const COLORS = ['#FF4B3E','#4FD1C5','#F5C451','#8B7CF6','#6FA8FF'];

function uid(){return 'm_'+Date.now()+'_'+Math.random().toString(36).slice(2,7);}

async function loadMeetings(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    meetings = raw ? JSON.parse(raw) : [];
  }catch(e){ meetings = []; }
  render();
}
async function saveMeetings(){
  try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(meetings)); }
  catch(e){ console.error('storage error', e); alert('Não foi possível salvar. O armazenamento do navegador pode estar cheio ou bloqueado.'); }
}

function fmtDate(d){return new Date(d).toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit'});}
function fmtTime(d){return new Date(d).toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});}
function sameDay(a,b){const x=new Date(a),y=new Date(b);return x.getFullYear()===y.getFullYear()&&x.getMonth()===y.getMonth()&&x.getDate()===y.getDate();}

function setGreeting(){
  const h = new Date().getHours();
  document.getElementById('greeting').textContent = h<12?'Bom dia':h<18?'Boa tarde':'Boa noite';
}

function setTab(t){
  currentTab = t;
  document.querySelectorAll('.tab-btn').forEach(b=>b.classList.toggle('active', b.dataset.tab===t));
  render();
}

function render(){
  const main = document.getElementById('main');
  if(currentTab==='home') main.innerHTML = renderHome();
  else if(currentTab==='calendar') main.innerHTML = renderCalendar();
  else if(currentTab==='history') main.innerHTML = renderHistory();
  else if(currentTab==='reports') main.innerHTML = renderReports();
}

function renderHome(){
  const now = new Date();
  const todayList = meetings.filter(m=>sameDay(m.start, now)).sort((a,b)=>new Date(a.start)-new Date(b.start));
  const weekAgo = new Date(now); weekAgo.setDate(now.getDate()-7);
  const monthAgo = new Date(now); monthAgo.setDate(now.getDate()-30);
  const weekCount = meetings.filter(m=>new Date(m.start)>=weekAgo && new Date(m.start)<=now).length;
  const monthCount = meetings.filter(m=>new Date(m.start)>=monthAgo && new Date(m.start)<=now).length;

  return `
    <div class="stats">
      <div class="stat"><b>${todayList.length}</b><span>Hoje</span></div>
      <div class="stat"><b>${weekCount}</b><span>Esta semana</span></div>
      <div class="stat"><b>${monthCount}</b><span>Este mês</span></div>
    </div>
    <div class="quick">
      <button onclick="openNewMeeting()"><span class="ic">📅</span>Nova reunião<small>Agendar agora</small></button>
      <button onclick="setTab('reports')"><span class="ic">📊</span>Relatórios<small>Ver análises</small></button>
      <button onclick="setTab('calendar')"><span class="ic">🗓️</span>Calendário<small>Ver agenda</small></button>
      <button onclick="setTab('history')"><span class="ic">📋</span>Histórico<small>Todos os registros</small></button>
    </div>
    <div class="section-title"><h2>Hoje</h2><a onclick="setTab('calendar')">Ver tudo</a></div>
    ${todayList.length? todayList.map(cardHtml).join('') : emptyState('Nada por aqui','Suas reuniões de hoje aparecem neste espaço.')}
  `;
}

function emptyState(title, sub){
  return `<div class="empty"><b>${title}</b>${sub}</div>`;
}

function cardHtml(m){
  return `<div class="meeting-card" style="--mc:${m.color}" onclick="openDetail('${m.id}')">
    <div class="info">
      <b>${escapeHtml(m.title||'Sem título')}</b>
      <span>${escapeHtml(m.context||'')}</span>
      ${m.transcript ? '<span class="tag-transcript">📝 Transcrição</span>' : ''}
    </div>
    <div class="time"><b>${fmtTime(m.start)}</b>${fmtDate(m.start)}</div>
  </div>`;
}

function escapeHtml(s){const d=document.createElement('div');d.textContent=s;return d.innerHTML;}

function renderHistory(){
  const list = [...meetings].sort((a,b)=>new Date(b.start)-new Date(a.start));
  return `
    <div class="section-title"><h2>Histórico</h2></div>
    ${list.length? list.map(cardHtml).join('') : emptyState('Nenhum registro ainda','As reuniões que você criar vão aparecer aqui — nada vem pré-carregado.')}
  `;
}

function renderReports(){
  const now = new Date();
  const startWeek = new Date(now); startWeek.setDate(now.getDate()-7);
  const startMonth = new Date(now); startMonth.setMonth(now.getMonth()-1);
  const startQ = new Date(now); startQ.setMonth(now.getMonth()-3);
  const count = (from)=>meetings.filter(m=>new Date(m.start)>=from && new Date(m.start)<=now).length;
  return `
    <div class="section-title"><h2>Relatórios</h2></div>
    <div class="stats" style="grid-template-columns:1fr 1fr;">
      <div class="stat"><b>${count(startWeek)}</b><span>Semana</span></div>
      <div class="stat"><b>${count(startMonth)}</b><span>Mês</span></div>
      <div class="stat"><b>${count(startQ)}</b><span>Trimestre</span></div>
      <div class="stat"><b>${meetings.length}</b><span>Total</span></div>
    </div>
    <div class="section-title"><h2>Com transcrição</h2></div>
    <div class="stat" style="text-align:left;padding:16px;">
      <b style="font-size:20px;">${meetings.filter(m=>m.transcript).length}</b>
      <span style="display:block;margin-top:4px;">de ${meetings.length} reuniões têm transcrição gravada</span>
    </div>
  `;
}

function renderCalendar(){
  const y = calRef.getFullYear(), mo = calRef.getMonth();
  const first = new Date(y,mo,1);
  const startOffset = first.getDay();
  const daysInMonth = new Date(y,mo+1,0).getDate();
  const monthName = calRef.toLocaleDateString('pt-BR',{month:'long', year:'numeric'});
  const today = new Date();
  let cells = '';
  for(let i=0;i<startOffset;i++){
    const d = new Date(y,mo,1-(startOffset-i));
    cells += `<div class="day other">${d.getDate()}</div>`;
  }
  for(let d=1; d<=daysInMonth; d++){
    const dateObj = new Date(y,mo,d);
    const hasM = meetings.some(m=>sameDay(m.start, dateObj));
    const isToday = sameDay(dateObj, today);
    cells += `<div class="day${isToday?' today':''}" onclick="showDay('${dateObj.toISOString()}')">${d}${hasM?'<div class="dot"></div>':''}</div>`;
  }
  return `
    <div class="cal-head">
      <button onclick="calRef.setMonth(calRef.getMonth()-1); render();">‹</button>
      <h2 style="text-transform:capitalize;">${monthName}</h2>
      <button onclick="calRef.setMonth(calRef.getMonth()+1); render();">›</button>
    </div>
    <div class="cal-grid">
      ${['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'].map(d=>`<div class="dow">${d}</div>`).join('')}
      ${cells}
    </div>
    <div id="day-list" style="margin-top:18px;"></div>
  `;
}

function showDay(iso){
  const d = new Date(iso);
  const list = meetings.filter(m=>sameDay(m.start,d)).sort((a,b)=>new Date(a.start)-new Date(b.start));
  document.getElementById('day-list').innerHTML = `
    <div class="section-title"><h2>${d.toLocaleDateString('pt-BR',{weekday:'long',day:'2-digit',month:'long'})}</h2></div>
    ${list.length? list.map(cardHtml).join('') : emptyState('Sem reuniões', 'Nenhuma reunião marcada para este dia.')}
  `;
}

// ---- New meeting modal ----
function openNewMeeting(){
  const now = new Date();
  const startISO = new Date(now.getTime()+60*60*1000).toISOString().slice(0,16);
  const endISO = new Date(now.getTime()+2*60*60*1000).toISOString().slice(0,16);
  const html = `
  <div class="modal-bg" id="modal-bg" onclick="if(event.target.id==='modal-bg')closeModal()">
    <div class="modal">
      <div class="modal-head"><h3>Nova reunião</h3><button onclick="closeModal()">✕</button></div>
      <label>Título</label>
      <input type="text" id="f-title" placeholder="Ex: Alinhamento de projeto">
      <label>Equipe / Contexto</label>
      <input type="text" id="f-context" placeholder="Ex: Time comercial">
      <div class="row2">
        <div><label>Início</label><input type="datetime-local" id="f-start" value="${startISO}"></div>
        <div><label>Fim</label><input type="datetime-local" id="f-end" value="${endISO}"></div>
      </div>
      <label>Recorrência</label>
      <select id="f-rec">
        <option value="once">Uma vez</option>
        <option value="daily">Diária</option>
        <option value="weekly">Semanal</option>
        <option value="monthly">Mensal</option>
      </select>
      <label>Notas</label>
      <textarea id="f-notes" placeholder="Pauta, links, observações..."></textarea>
      <label>Cor</label>
      <div class="colors" id="f-colors">
        ${COLORS.map((c,i)=>`<span style="background:${c}" class="${i===0?'sel':''}" onclick="selectColor(this,'${c}')" data-c="${c}"></span>`).join('')}
      </div>
      <button class="btn-primary" onclick="saveNewMeeting()">Salvar reunião</button>
    </div>
  </div>`;
  document.body.insertAdjacentHTML('beforeend', html);
}
function selectColor(el,c){
  document.querySelectorAll('#f-colors span').forEach(s=>s.classList.remove('sel'));
  el.classList.add('sel');
}
function closeModal(){
  const bg = document.getElementById('modal-bg');
  if(bg) bg.remove();
  stopEverything(false);
}
async function saveNewMeeting(){
  const title = document.getElementById('f-title').value.trim();
  if(!title){ document.getElementById('f-title').focus(); return; }
  const color = document.querySelector('#f-colors .sel')?.dataset.c || COLORS[0];
  const m = {
    id: uid(),
    title,
    context: document.getElementById('f-context').value.trim(),
    start: new Date(document.getElementById('f-start').value).toISOString(),
    end: new Date(document.getElementById('f-end').value).toISOString(),
    recurrence: document.getElementById('f-rec').value,
    notes: document.getElementById('f-notes').value.trim(),
    color,
    transcript: ''
  };
  meetings.push(m);
  await saveMeetings();
  closeModal();
  render();
}

// ---- Detail modal with recording/transcription ----
function openDetail(id){
  activeMeetingId = id;
  const m = meetings.find(x=>x.id===id);
  if(!m) return;
  const html = `
  <div class="modal-bg center" id="modal-bg" onclick="if(event.target.id==='modal-bg'){closeModal();}">
    <div class="modal">
      <div class="modal-head"><h3>${escapeHtml(m.title)}</h3><button onclick="closeModal()">✕</button></div>
      <div class="eyebrow">${escapeHtml(m.context||'')}</div>
      <p class="mono" style="color:var(--muted);font-size:13px;">${fmtDate(m.start)} · ${fmtTime(m.start)} – ${fmtTime(m.end)}</p>
      ${m.notes ? `<p style="font-size:13px;">${escapeHtml(m.notes)}</p>` : ''}

      <div class="rec-box" id="rec-box">
        <button class="rec-btn" id="rec-btn" onclick="toggleRecording()">🎙️</button>
        <div class="wave" id="wave">${Array.from({length:16}).map(()=>'<i></i>').join('')}</div>
        <div class="rec-status" id="rec-status">Toque para gravar e transcrever</div>
      </div>

      <label>Transcrição</label>
      <div class="transcript-box ${m.transcript?'':'empty2'}" id="transcript-view">${m.transcript ? escapeHtml(m.transcript) : 'Nenhuma transcrição ainda. Grave a reunião para transcrever automaticamente.'}</div>
      <p class="note">A transcrição usa reconhecimento de voz do navegador (em português) e funciona melhor no Chrome. O áudio gravado não é enviado nem salvo — apenas o texto transcrito é guardado nesta reunião.</p>

      <div id="share-actions">${renderShareActions(m)}</div>

      <button class="btn-ghost" onclick="deleteMeeting('${m.id}')">Excluir reunião</button>
    </div>
  </div>`;
  document.body.insertAdjacentHTML('beforeend', html);
}

function ataFields(m){
  return {
    title: m.title || 'Sem título',
    date: fmtDate(m.start),
    time: `${fmtTime(m.start)} às ${fmtTime(m.end)}`,
    context: m.context || '-',
    notes: m.notes || '-',
    transcript: m.transcript || '-'
  };
}

function generateAta(m){
  const f = ataFields(m);
  return `ATA DE REUNIÃO\n\nTítulo: ${f.title}\nData: ${f.date}\nHorário: ${f.time}\nEquipe/Contexto: ${f.context}\n\nPauta/Notas:\n${f.notes}\n\nConteúdo transcrito:\n${f.transcript}`;
}

function renderShareActions(m){
  if(!m.transcript){
    return `<p class="note" style="margin-top:16px;">As opções de compartilhamento (WhatsApp, PDF, ata) aparecem aqui assim que você gravar e transcrever a reunião.</p>`;
  }
  return `
    <label>Compartilhar</label>
    <div class="share-row">
      <button onclick="shareWhatsApp('${m.id}')">💬<br>WhatsApp</button>
      <button onclick="downloadPDF('${m.id}')">📄<br>PDF</button>
      <button onclick="copyAta('${m.id}')">📋<br>Copiar ata</button>
    </div>
    <div id="copy-feedback" style="text-align:center;font-size:12px;color:var(--calm);height:14px;margin-top:4px;"></div>
  `;
}

function shareWhatsApp(id){
  const m = meetings.find(x=>x.id===id); if(!m) return;
  const url = 'https://wa.me/?text=' + encodeURIComponent(generateAta(m));
  window.open(url, '_blank');
}

function downloadPDF(id){
  const m = meetings.find(x=>x.id===id); if(!m) return;
  if(!window.jspdf){ alert('Exportação de PDF indisponível no momento.'); return; }
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF();
  const f = ataFields(m);
  doc.setFont('helvetica','bold'); doc.setFontSize(16);
  doc.text('Ata de Reunião', 14, 18);
  doc.setDrawColor(210); doc.line(14, 22, 196, 22);
  const body = `Título: ${f.title}\nData: ${f.date}\nHorário: ${f.time}\nEquipe/Contexto: ${f.context}\n\nPauta/Notas:\n${f.notes}\n\nConteúdo transcrito:\n${f.transcript}`;
  doc.setFont('helvetica','normal'); doc.setFontSize(11);
  const lines = doc.splitTextToSize(body, 180);
  doc.text(lines, 14, 32);
  doc.save(`ata-${f.title.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/(^-|-$)/g,'')||'reuniao'}.pdf`);
}

function copyAta(id){
  const m = meetings.find(x=>x.id===id); if(!m) return;
  const text = generateAta(m);
  navigator.clipboard.writeText(text).then(()=>{
    const fb = document.getElementById('copy-feedback');
    if(fb){ fb.textContent = 'Ata copiada!'; setTimeout(()=>{ if(fb) fb.textContent=''; }, 2000); }
  }).catch(()=>{
    alert('Não foi possível copiar automaticamente. Selecione e copie o texto manualmente.');
  });
}

async function deleteMeeting(id){
  meetings = meetings.filter(m=>m.id!==id);
  await saveMeetings();
  closeModal();
  render();
}

function getMeeting(){ return meetings.find(m=>m.id===activeMeetingId); }

async function toggleRecording(){
  if(recording){ await stopEverything(true); }
  else { await startRecording(); }
}

async function startRecording(){
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  try{
    mediaStream = await navigator.mediaDevices.getUserMedia({audio:true});
  }catch(e){
    document.getElementById('rec-status').textContent = 'Não foi possível acessar o microfone.';
    return;
  }
  recording = true;
  finalTranscript = getMeeting()?.transcript || '';
  document.getElementById('rec-btn').classList.add('recording');
  document.getElementById('rec-btn').textContent = '⏹️';
  document.getElementById('rec-status').textContent = 'Gravando e transcrevendo...';

  // waveform visualization
  audioCtx = new (window.AudioContext||window.webkitAudioContext)();
  const src = audioCtx.createMediaStreamSource(mediaStream);
  analyser = audioCtx.createAnalyser();
  analyser.fftSize = 64;
  src.connect(analyser);
  const bars = document.querySelectorAll('#wave i');
  const data = new Uint8Array(analyser.frequencyBinCount);
  function drawWave(){
    analyser.getByteFrequencyData(data);
    bars.forEach((b,i)=>{
      const v = data[i % data.length] || 0;
      b.style.height = Math.max(6, (v/255)*32) + 'px';
    });
    rafId = requestAnimationFrame(drawWave);
  }
  drawWave();

  // speech recognition
  if(SR){
    recognition = new SR();
    recognition.lang = 'pt-BR';
    recognition.continuous = true;
    recognition.interimResults = true;
    recognition.onresult = (e)=>{
      let interim = '';
      for(let i=e.resultIndex;i<e.results.length;i++){
        const t = e.results[i][0].transcript;
        if(e.results[i].isFinal) finalTranscript += t + ' ';
        else interim += t;
      }
      const view = document.getElementById('transcript-view');
      if(view){
        view.classList.remove('empty2');
        view.textContent = finalTranscript + interim;
      }
    };
    recognition.onerror = ()=>{};
    recognition.onend = ()=>{ if(recording) { try{recognition.start();}catch(e){} } };
    recognition.start();
  }else{
    document.getElementById('rec-status').textContent = 'Gravando (transcrição indisponível neste navegador)...';
  }
}

async function stopEverything(persist){
  recording = false;
  if(recognition){ try{ recognition.onend=null; recognition.stop(); }catch(e){} recognition=null; }
  if(rafId){ cancelAnimationFrame(rafId); rafId=null; }
  if(audioCtx){ try{audioCtx.close();}catch(e){} audioCtx=null; }
  if(mediaStream){ mediaStream.getTracks().forEach(t=>t.stop()); mediaStream=null; }

  const btn = document.getElementById('rec-btn');
  if(btn){ btn.classList.remove('recording'); btn.textContent='🎙️'; }
  const status = document.getElementById('rec-status');
  if(status) status.textContent = 'Toque para gravar e transcrever';

  if(persist && activeMeetingId){
    const m = getMeeting();
    if(m){
      m.transcript = finalTranscript.trim();
      await saveMeetings();
      const shareDiv = document.getElementById('share-actions');
      if(shareDiv) shareDiv.innerHTML = renderShareActions(m);
      render();
    }
  }
}

setGreeting();
loadMeetings();
</script>
</body>
